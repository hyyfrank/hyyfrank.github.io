baseURL = "http://localhost:1313/"
title = "H&W"
theme = "PaperMod"

enableRobotsTXT = true
enableEmoji = true
hasCJKLanguage = true
enableGitInfo = true

mainSections = ["post"]

[pagination]
  pagerSize = 5

defaultContentLanguage = "en"
languageCode = "en"

[languages.en]
  weight = 1
  label = "English"
  locale = "en"
  title = "H&W"
  contentDir = "content/en"

[languages.zh]
  weight = 2
  label = "繁體中文"
  locale = "zh-Hant"
  title = "H&W"
  contentDir = "content/zh"

[taxonomies]
  tag = "tags"
  category = "categories"

[permalinks]
  categories = "/categories/:slug/"

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[[languages.en.menu.main]]
  name = "Tech"
  url = "/post/"
  weight = 10
[[languages.en.menu.main]]
  name = "Categories"
  url = "/categories/"
  weight = 20
[[languages.en.menu.main]]
  name = "About"
  url = "/about/"
  weight = 30

[[languages.zh.menu.main]]
  name = "技術"
  url = "/post/"
  weight = 10
[[languages.zh.menu.main]]
  name = "分類"
  url = "/categories/"
  weight = 20
[[languages.zh.menu.main]]
  name = "關於"
  url = "/about/"
  weight = 30

[params]
  env = "production"
  description = "H&W tech blog"
  author = "hyyfrank"
  keywords = ["Hugo", "tech", "blog"]

  [params.label]
    text = "H&W"

  DateFormat = "2006-01-02"
  defaultTheme = "dark"
  disableThemeToggle = false

  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false

  [params.homeInfoParams]
    Title = "H&W"
    Content = "Tech notes and engineering blog"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/hyyfrank"
  [[params.socialIcons]]
    name = "email"
    url = "mailto:hyyfrank@email.com"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "dracula"
    codeFences = true
    guessSyntax = true
    lineNos = true
    lineNumbersInTable = true
    noClasses = false
    tabWidth = 4

[minify]
  disableXML = true
  minifyOutput = true
